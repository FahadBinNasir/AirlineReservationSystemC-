<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-label="Airline Reservation System passenger console: navigation rail, booking metric cards, route map, and booking activity">
  <style>
    .surface{fill:#F3F2F2;stroke:#201E1D;stroke-width:1}
    .chrome{fill:#F8F4F4;stroke:#BAB6B6;stroke-width:1}
    .panel{fill:#F8F4F4;stroke:#BAB6B6;stroke-width:1}
    .panel-alt{fill:#EAE7E7;stroke:#BAB6B6;stroke-width:1}
    .inset{fill:#EAE9E9;stroke:#BAB6B6;stroke-width:1}
    .rule{stroke:#BAB6B6;stroke-width:1}
    .ink{fill:#201E1D}
    .sub{fill:#605D5D}
    .muted{fill:#605D5D}
    .signal{fill:#EC3013}
    .signal-stroke{stroke:#EC3013}
    .accent{stroke:#AE1800}
    .route{stroke:#605D5D;stroke-width:1;fill:none;stroke-dasharray:4 6}
    .dot{fill:#605D5D;opacity:.3}
    .bracket{stroke:#605D5D;stroke-width:1.4;fill:none}
    .ok{fill:#217A48}
    .ok-bar{fill:#217A48}
    .warn{fill:#8A5A10}
    .warn-bar{fill:#8A5A10}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .sans{font-family:Archivo,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

    @keyframes routeflow{to{stroke-dashoffset:-80}}
    @keyframes ringpulse{0%,100%{opacity:.32}50%{opacity:.88}}
    @keyframes livepulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes barin{from{transform:scaleY(0)}to{transform:scaleY(1)}}
    .route{animation:routeflow 4.2s linear infinite}
    .route-b{animation-delay:-1.4s;animation-duration:5.1s}
    .ring{animation:ringpulse 3.2s ease-in-out infinite}
    .live{animation:livepulse 2s ease-in-out infinite}
    .bar{transform-origin:bottom;animation:barin 520ms cubic-bezier(.2,.75,.25,1) both}
    .b1{animation-delay:40ms}.b2{animation-delay:90ms}.b3{animation-delay:140ms}.b4{animation-delay:190ms}
    .b5{animation-delay:240ms}.b6{animation-delay:290ms}.b7{animation-delay:340ms}.b8{animation-delay:390ms}
    .b9{animation-delay:440ms}.b10{animation-delay:490ms}.b11{animation-delay:540ms}.b12{animation-delay:590ms}
    .b13{animation-delay:640ms}.b14{animation-delay:690ms}.b15{animation-delay:740ms}.b16{animation-delay:790ms}
    @media (prefers-reduced-motion: reduce){.route,.ring,.live,.bar{animation:none}}
    @media (prefers-color-scheme: dark){
      .surface{fill:#09090b;stroke:#27272a}
      .chrome{fill:#121215;stroke:#27272a}
      .panel{fill:#121215;stroke:#27272a}
      .panel-alt{fill:#18181b;stroke:#27272a}
      .inset{fill:#18181b;stroke:#27272a}
      .rule{stroke:#27272a}
      .ink{fill:#fafafa}
      .sub{fill:#a1a1aa}
      .muted{fill:#71717a}
      .route{stroke:#3f3f46}
      .dot{fill:#3f3f46;opacity:.4}
      .bracket{stroke:#3f3f46}
      .ok{fill:#4CAF78}
      .ok-bar{fill:#4CAF78}
      .warn{fill:#D39A3A}
      .warn-bar{fill:#D39A3A}
    }
  </style>

  <defs>
    <pattern id="dgB" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="0.8" class="dot"/>
    </pattern>
    <clipPath id="mclip"><rect x="212" y="52" width="972" height="712"/></clipPath>
  </defs>

  <rect width="1200" height="780" class="surface"/>

  <!-- ============ TOP BAR ============ -->
  <rect x="0" y="0" width="1200" height="52" class="chrome"/>
  <line x1="0" y1="52" x2="1200" y2="52" class="rule"/>
  <rect x="20" y="16" width="20" height="20" fill="none" stroke="#AE1800" stroke-width="1.6"/>
  <circle cx="30" cy="26" r="5" fill="none" stroke="#AE1800" stroke-width="1.2"/>
  <text x="52" y="31" font-size="11" font-weight="700" letter-spacing="2" class="ink mono">ARS CONSOLE</text>
  <g class="mono" font-size="10">
    <text x="1000" y="31" class="sub">PASSENGER</text>
    <circle cx="1146" cy="26" r="9" class="panel-alt"/>
    <text x="1146" y="30" text-anchor="middle" font-size="8" class="ink">FN</text>
  </g>

  <!-- ============ SIDEBAR ============ -->
  <rect x="0" y="52" width="196" height="728" class="chrome"/>
  <line x1="196" y1="52" x2="196" y2="780" class="rule"/>
  <text x="20" y="82" font-size="8.5" letter-spacing="1.6" class="muted mono">NAVIGATION</text>
  <g class="mono" font-size="10.5">
    <rect x="12" y="96" width="172" height="30" class="panel-alt"/>
    <line x1="12" y1="96" x2="12" y2="126" stroke="#EC3013" stroke-width="2"/>
    <rect x="24" y="106" width="10" height="10" fill="none" stroke="#EC3013" stroke-width="1.4"/>
    <text x="44" y="115" font-weight="700" class="ink">DASHBOARD</text>
    <rect x="24" y="146" width="10" height="10" fill="none" stroke="#605D5D" stroke-width="1.2"/>
    <text x="44" y="155" class="sub">SEARCH FLIGHTS</text>
    <rect x="24" y="178" width="10" height="10" fill="none" stroke="#605D5D" stroke-width="1.2"/>
    <text x="44" y="187" class="sub">MY BOOKINGS</text>
    <rect x="24" y="210" width="10" height="10" fill="none" stroke="#605D5D" stroke-width="1.2"/>
    <text x="44" y="219" class="sub">PROFILE</text>
    <rect x="24" y="242" width="10" height="10" fill="none" stroke="#605D5D" stroke-width="1.2"/>
    <text x="44" y="251" class="sub">SETTINGS</text>
  </g>
  <line x1="12" y1="312" x2="184" y2="312" class="rule"/>
  <text x="20" y="336" font-size="8.5" letter-spacing="1.6" class="muted mono">TRAVELER</text>
  <g class="mono" font-size="10">
    <text x="20" y="358" class="ink">FAHAD BIN NASIR</text>
    <text x="20" y="374" class="muted">VERIFIED FLYER</text>
  </g>
  <line x1="12" y1="700" x2="184" y2="700" class="rule"/>
  <g class="mono" font-size="9.5" opacity="0.75">
    <text x="20" y="722" class="muted">&#169; 2026 ARS</text>
    <text x="20" y="740" class="muted">12 BOOKINGS</text>
    <text x="20" y="758" class="muted">2FA ENABLED</text>
  </g>

  <!-- ============ MAIN ============ -->
  <g clip-path="url(#mclip)">
    <rect x="212" y="52" width="972" height="712" fill="url(#dgB)"/>

    <rect x="232" y="76" width="7" height="7" class="signal"/>
    <text x="250" y="84" font-size="9" font-weight="700" letter-spacing="1.5" class="signal mono">PASSENGER OVERVIEW</text>
    <text x="232" y="116" font-size="24" font-weight="700" letter-spacing="-0.8" class="ink sans">Flight Deck</text>
    <text x="232" y="138" font-size="11" class="sub sans">Live schedules, your bookings, and account status.</text>

    <rect x="1060" y="98" width="96" height="24" class="panel" fill="none"/>
    <circle cx="1076" cy="110" r="3.4" class="ok live"/>
    <text x="1086" y="114" font-size="9" letter-spacing="1.2" class="ok mono">BOOKING OPEN</text>

    <!-- metric cards -->
    <g>
      <rect x="232" y="164" width="288" height="86" class="panel"/>
      <path class="bracket" d="M 232 174 L 232 164 L 242 164"/>
      <path class="bracket" d="M 510 164 L 520 164 L 520 174"/>
      <text x="248" y="188" font-size="9" letter-spacing="1.4" class="muted mono">TOTAL FLIGHTS</text>
      <text x="248" y="226" font-size="26" font-weight="700" class="ink mono">248</text>
      <text x="248" y="242" font-size="9" class="ok mono">SCHEDULED &#183; THIS WEEK</text>
    </g>
    <g>
      <rect x="536" y="164" width="288" height="86" class="panel"/>
      <path class="bracket" d="M 536 174 L 536 164 L 546 164"/>
      <path class="bracket" d="M 814 164 L 824 164 L 824 174"/>
      <text x="552" y="188" font-size="9" letter-spacing="1.4" class="muted mono">MY BOOKINGS</text>
      <text x="552" y="226" font-size="26" font-weight="700" class="ink mono">12</text>
      <text x="552" y="242" font-size="9" class="sub mono">3 UPCOMING</text>
    </g>
    <g>
      <rect x="840" y="164" width="316" height="86" class="panel"/>
      <path class="bracket" d="M 840 174 L 840 164 L 850 164"/>
      <path class="bracket" d="M 1146 164 L 1156 164 L 1156 174"/>
      <text x="856" y="188" font-size="9" letter-spacing="1.4" class="muted mono">NEXT FLIGHT</text>
      <text x="856" y="226" font-size="26" font-weight="700" class="ink mono">PK-301</text>
      <text x="856" y="242" font-size="9" class="sub mono">KHI &#8594; LHE &#183; 08:00</text>
    </g>

    <!-- route map -->
    <g>
      <rect x="232" y="272" width="620" height="300" class="panel-alt"/>
      <path class="bracket" d="M 232 284 L 232 272 L 244 272"/>
      <path class="bracket" d="M 840 272 L 852 272 L 852 284"/>
      <path class="bracket" d="M 232 560 L 232 572 L 244 572"/>
      <path class="bracket" d="M 840 572 L 852 572 L 852 560"/>
      <text x="248" y="294" font-size="9" letter-spacing="1.4" class="muted mono">ROUTE MAP</text>

      <path class="route" d="M 300 372 C 340 372, 360 422, 396 422"/>
      <path class="route route-b" d="M 300 422 H 396"/>
      <path class="route" d="M 300 472 C 340 472, 360 422, 396 422"/>
      <path class="route route-b" d="M 712 372 C 672 372, 652 422, 616 422"/>
      <path class="route" d="M 712 422 H 616"/>
      <path class="route route-b" d="M 712 472 C 672 472, 652 422, 616 422"/>

      <g class="mono">
        <rect x="246" y="348" width="54" height="48" class="inset"/>
        <text x="273" y="378" text-anchor="middle" font-size="8" class="sub">KHI</text>
        <rect x="246" y="398" width="54" height="48" class="inset"/>
        <text x="273" y="428" text-anchor="middle" font-size="8" class="sub">LHE</text>
        <rect x="246" y="448" width="54" height="48" class="inset"/>
        <text x="273" y="478" text-anchor="middle" font-size="8" class="muted">ISB</text>
      </g>
      <g class="mono">
        <rect x="712" y="348" width="54" height="48" class="inset"/>
        <text x="739" y="378" text-anchor="middle" font-size="8" class="sub">DXB</text>
        <rect x="712" y="398" width="54" height="48" class="inset"/>
        <text x="739" y="428" text-anchor="middle" font-size="8" class="sub">JED</text>
        <rect x="712" y="448" width="54" height="48" class="inset"/>
        <text x="739" y="478" text-anchor="middle" font-size="8" class="sub">DOH</text>
      </g>

      <g transform="translate(506,422)">
        <rect x="-46" y="-46" width="92" height="92" class="ring" fill="none" stroke="#EC3013" stroke-width="1" transform="rotate(45)"/>
        <rect x="-40" y="-40" width="80" height="80" fill="none" stroke="#AE1800" stroke-width="1.6"/>
        <rect x="-34" y="-34" width="68" height="68" fill="none" stroke="#AE1800" stroke-width="1.2"/>
        <circle cx="0" cy="0" r="18" fill="none" stroke="#AE1800" stroke-width="2"/>
        <line x1="-46" y1="0" x2="46" y2="0" stroke="#AE1800" stroke-width="1.3"/>
        <line x1="0" y1="-46" x2="0" y2="46" stroke="#AE1800" stroke-width="1.3"/>
        <circle cx="0" cy="0" r="3.6" class="signal"/>
      </g>
      <text x="506" y="492" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1.8" class="ink mono">HUB</text>
      <text x="506" y="508" text-anchor="middle" font-size="8" class="muted mono">SCHEDULE CORE</text>

      <line x1="248" y1="546" x2="836" y2="546" class="rule"/>
      <text x="248" y="562" font-size="8.5" letter-spacing="1.2" class="muted mono">SIX AIRPORT STATIONS &#183; ROUTES CARRY SCHEDULED FLIGHTS</text>
    </g>

    <!-- right: booking activity -->
    <g>
      <rect x="868" y="272" width="288" height="300" class="panel"/>
      <path class="bracket" d="M 868 284 L 868 272 L 880 272"/>
      <path class="bracket" d="M 1144 272 L 1156 272 L 1156 284"/>
      <path class="bracket" d="M 868 560 L 868 572 L 880 572"/>
      <path class="bracket" d="M 1144 572 L 1156 572 L 1156 560"/>
      <text x="884" y="294" font-size="9" letter-spacing="1.4" class="muted mono">BOOKING ACTIVITY</text>
      <line x1="884" y1="304" x2="1140" y2="304" class="rule"/>

      <g>
        <rect x="884"  y="516" width="12" height="9"   class="ok-bar bar b1"/>
        <rect x="900"  y="513" width="12" height="12"  class="ok-bar bar b2"/>
        <rect x="916"  y="516" width="12" height="9"   class="ok-bar bar b3"/>
        <rect x="932"  y="510" width="12" height="15"  class="ok-bar bar b4"/>
        <rect x="948"  y="516" width="12" height="9"   class="ok-bar bar b5"/>
        <rect x="964"  y="513" width="12" height="12"  class="ok-bar bar b6"/>
        <rect x="980"  y="504" width="12" height="21"  class="warn-bar bar b7"/>
        <rect x="996"  y="516" width="12" height="9"   class="ok-bar bar b8"/>
        <rect x="1012" y="513" width="12" height="12"  class="ok-bar bar b9"/>
        <rect x="1028" y="516" width="12" height="9"   class="ok-bar bar b10"/>
        <rect x="1044" y="510" width="12" height="15"  class="ok-bar bar b11"/>
        <rect x="1060" y="516" width="12" height="9"   class="ok-bar bar b12"/>
        <rect x="1076" y="513" width="12" height="12"  class="ok-bar bar b13"/>
        <rect x="1092" y="516" width="12" height="9"   class="ok-bar bar b14"/>
        <rect x="1108" y="510" width="12" height="15"  class="ok-bar bar b15"/>
        <rect x="1124" y="513" width="12" height="12"  class="ok-bar bar b16"/>
      </g>
      <line x1="884" y1="525" x2="1140" y2="525" class="rule"/>
      <g class="mono" font-size="8">
        <text x="884" y="540" class="muted">EARLIER</text>
        <text x="1140" y="540" text-anchor="end" class="muted">NOW</text>
      </g>

      <line x1="884" y1="352" x2="1140" y2="352" class="rule"/>
      <g class="mono" font-size="9">
        <rect x="884" y="322" width="6" height="6" class="ok-bar"/>
        <text x="900" y="329" class="ink">PK-301 &#183; KHI-LHE</text>
        <text x="1140" y="329" text-anchor="end" class="ok">CONFIRMED</text>
        <rect x="884" y="364" width="6" height="6" class="ok-bar"/>
        <text x="900" y="371" class="ink">PK-702 &#183; KHI-ISB</text>
        <text x="1140" y="371" text-anchor="end" class="ok">CONFIRMED</text>
        <rect x="884" y="406" width="6" height="6" class="warn-bar"/>
        <text x="900" y="413" class="ink">PK-890 &#183; KHI-DXB</text>
        <text x="1140" y="413" text-anchor="end" class="warn">PAYMENT DUE</text>
        <rect x="884" y="448" width="6" height="6" class="ok-bar"/>
        <text x="900" y="455" class="ink">PK-455 &#183; LHE-KHI</text>
        <text x="1140" y="455" text-anchor="end" class="ok">CONFIRMED</text>
        <rect x="884" y="490" width="6" height="6" class="ok-bar"/>
        <text x="900" y="497" class="ink">PK-118 &#183; ISB-DXB</text>
        <text x="1140" y="497" text-anchor="end" class="ok">CONFIRMED</text>
      </g>
    </g>

    <!-- bottom strip -->
    <rect x="232" y="592" width="924" height="72" class="panel"/>
    <text x="248" y="614" font-size="9" letter-spacing="1.4" class="muted mono">PIPELINE</text>
    <g class="mono" font-size="9">
      <text x="330" y="614" class="ink">SEARCH</text>
      <path d="M 392 610 h18 m-5 -4 l5 4 l-5 4" stroke="#EC3013" stroke-width="1.3" fill="none"/>
      <text x="422" y="614" class="ink">BOOK</text>
      <path d="M 470 610 h18 m-5 -4 l5 4 l-5 4" stroke="#EC3013" stroke-width="1.3" fill="none"/>
      <text x="500" y="614" class="ink">PAY</text>
      <path d="M 532 610 h18 m-5 -4 l5 4 l-5 4" stroke="#EC3013" stroke-width="1.3" fill="none"/>
      <text x="562" y="614" class="ink">CONFIRM</text>
      <path d="M 632 610 h18 m-5 -4 l5 4 l-5 4" stroke="#EC3013" stroke-width="1.3" fill="none"/>
      <text x="662" y="614" class="ink">FLY</text>
    </g>
    <line x1="248" y1="630" x2="1140" y2="630" class="rule"/>
    <text x="248" y="650" font-size="8.5" letter-spacing="1.2" class="muted mono">PAYMENTS ARE CONFIRMED BEFORE A SEAT IS RESERVED.</text>
  </g>
</svg>
